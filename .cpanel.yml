---
deployment:
  tasks:
    - export APPROOT=/home/USERNAME/APPDOMAIN
    - export LOGDIR=$APPROOT/deploy-logs
    - /bin/mkdir -p "$LOGDIR"
    - export RUNSTAMP=$(/bin/date -u '+%Y%m%dT%H%M%SZ')
    - export REVISION=$(/usr/bin/git rev-parse --short HEAD 2>/dev/null || /bin/echo unknown)
    - export BUILDSTAMP=$(/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')
    - export LOGFILE=$LOGDIR/cpanel-deploy-$RUNSTAMP.log
    - /bin/echo "[deploy] start $(/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')" | /usr/bin/tee -a "$LOGFILE"
    - /bin/mkdir -p "$APPROOT" 2>&1 | /usr/bin/tee -a "$LOGFILE"
    - /bin/echo "[deploy] syncing API files" | /usr/bin/tee -a "$LOGFILE"
    - >
      (cd . && /bin/tar --exclude='.env' --exclude='.venv' --exclude='__pycache__' --exclude='*.log' -cf - .)
      | (cd "$APPROOT" && /bin/tar -xf -) 2>&1 | /usr/bin/tee -a "$LOGFILE"
    - /bin/echo "[deploy] writing runtime stamp file" | /usr/bin/tee -a "$LOGFILE"
    - /bin/printf 'POD_APP_REVISION=%s\nPOD_APP_BUILD=%s\n' "$REVISION" "$BUILDSTAMP" > "$APPROOT/.deploy-stamp.env"
    - /bin/chmod 644 "$APPROOT/.deploy-stamp.env" 2>&1 | /usr/bin/tee -a "$LOGFILE"
    - /bin/echo "[deploy] installing requirements" | /usr/bin/tee -a "$LOGFILE"
    - >
      /bin/bash -lc "
      source /home/USERNAME/virtualenv/APPDOMAIN/3.12/bin/activate &&
      python -m pip install --upgrade pip &&
      python -m pip install -r $APPROOT/requirements.txt
      " 2>&1 | /usr/bin/tee -a "$LOGFILE"
    - /bin/echo "[deploy] requesting passenger restart" | /usr/bin/tee -a "$LOGFILE"
    - /bin/mkdir -p "$APPROOT/tmp" 2>&1 | /usr/bin/tee -a "$LOGFILE"
    - /usr/bin/touch "$APPROOT/tmp/restart.txt" 2>&1 | /usr/bin/tee -a "$LOGFILE"
    - /bin/echo "[deploy] done $(/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')" | /usr/bin/tee -a "$LOGFILE"
