name: Implement reply proposal flow

on:
  push:
    branches:
      - affirm-reply-feature

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: affirm-reply-feature
          fetch-depth: 0
      - name: Patch, validate, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          db_path = Path("db.py")
          db = db_path.read_text()
          schema_anchor = "            conn.commit()\\n        except sqlite3.Error as e:"
          schema_sql = '''            cursor.execute(
                """
                CREATE TABLE IF NOT EXISTS reply_proposals (
                    proposal_id TEXT PRIMARY KEY,
                    tenant_id TEXT,
                    channel_id TEXT,
                    source_message_id TEXT,
                    reply_message TEXT,
                    source_context TEXT,
                    status TEXT NOT NULL DEFAULT 'pending'
                        CHECK(status IN ('pending','approved','sent','expired','failed')),
                    created_at INTEGER,
                    expires_at INTEGER,
                    approved_at INTEGER,
                    sent_at INTEGER,
                    result TEXT,
                    error TEXT,
                    UNIQUE(channel_id, source_message_id)
                )
                """
            )
'''
          if schema_anchor not in db:
              raise SystemExit("db schema anchor not found")
          db = db.replace(schema_anchor, schema_sql + "\\n" + schema_anchor, 1)

          methods_anchor = "    def close(self):"
          methods = '''    def _reply_proposal_from_row(self, row):
          if not row:
              return None
          columns = (
              "proposal_id", "tenant_id", "channel_id", "source_message_id",
              "reply_message", "source_context", "status", "created_at",
              "expires_at", "approved_at", "sent_at", "result", "error",
          )
          return dict(zip(columns, row))

      def create_reply_proposal(
          self,
          proposal_id: str,
          tenant_id: str,
          channel_id: str,
          source_message_id: str,
          reply_message: str,
          source_context: str,
          created_at: int,
          expires_at: int,
      ) -> dict:
          conn = self._get_conn()
          cursor = conn.cursor()
          cursor.execute(
              """
              INSERT OR IGNORE INTO reply_proposals
                  (proposal_id, tenant_id, channel_id, source_message_id,
                   reply_message, source_context, created_at, expires_at)
              VALUES (?, ?, ?, ?, ?, ?, ?, ?)
              """,
              (proposal_id, tenant_id, channel_id, source_message_id,
               reply_message, source_context, created_at, expires_at),
          )
          conn.commit()
          return self.get_reply_proposal(proposal_id) or self.get_reply_proposal_by_source(
              channel_id, source_message_id
          )

      def get_reply_proposal(self, proposal_id: str):
          cursor = self._get_conn().cursor()
          cursor.execute(
              """
              SELECT proposal_id, tenant_id, channel_id, source_message_id,
                     reply_message, source_context, status, created_at,
                     expires_at, approved_at, sent_at, result, error
              FROM reply_proposals WHERE proposal_id = ?
              """,
              (proposal_id,),
          )
          return self._reply_proposal_from_row(cursor.fetchone())

      def get_reply_proposal_by_source(self, channel_id: str, source_message_id: str):
          cursor = self._get_conn().cursor()
          cursor.execute(
              """
              SELECT proposal_id, tenant_id, channel_id, source_message_id,
                     reply_message, source_context, status, created_at,
                     expires_at, approved_at, sent_at, result, error
              FROM reply_proposals
              WHERE channel_id = ? AND source_message_id = ?
              """,
              (channel_id, source_message_id),
          )
          return self._reply_proposal_from_row(cursor.fetchone())

      def expire_reply_proposal_if_needed(self, proposal_id: str, now: int) -> bool:
          conn = self._get_conn()
          cursor = conn.cursor()
          cursor.execute(
              """
              UPDATE reply_proposals
              SET status = 'expired', error = COALESCE(error, 'expired')
              WHERE proposal_id = ? AND status = 'pending' AND expires_at <= ?
              """,
              (proposal_id, now),
          )
          conn.commit()
          return cursor.rowcount > 0

      def claim_reply_proposal(self, proposal_id: str, now: int) -> bool:
          conn = self._get_conn()
          cursor = conn.cursor()
          cursor.execute(
              """
              UPDATE reply_proposals
              SET status = 'approved', approved_at = ?, error = NULL
              WHERE proposal_id = ? AND status = 'pending' AND expires_at > ?
              """,
              (now, proposal_id, now),
          )
          conn.commit()
          return cursor.rowcount > 0

      def mark_reply_proposal_sent(self, proposal_id: str, result: str = "sent") -> bool:
          conn = self._get_conn()
          cursor = conn.cursor()
          cursor.execute(
              """
              UPDATE reply_proposals
              SET status = 'sent', sent_at = ?, result = ?, error = NULL
              WHERE proposal_id = ? AND status = 'approved'
              """,
              (int(time.time()), result, proposal_id),
          )
          conn.commit()
          return cursor.rowcount > 0

      def restore_reply_proposal(self, proposal_id: str, error: str = "") -> bool:
          conn = self._get_conn()
          cursor = conn.cursor()
          cursor.execute(
              """
              UPDATE reply_proposals
              SET status = 'pending', approved_at = NULL, error = ?
              WHERE proposal_id = ? AND status = 'approved'
              """,
              (error, proposal_id),
          )
          conn.commit()
          return cursor.rowcount > 0

'''
          if methods_anchor not in db:
              raise SystemExit("db methods anchor not found")
          db = db.replace(methods_anchor, methods + methods_anchor, 1)
          db_path.write_text(db)

          app_path = Path("app.py")
          app = app_path.read_text()
          import_anchor = "import hashlib\\n"
          if import_anchor not in app:
              raise SystemExit("app import anchor not found")
          app = app.replace(import_anchor, import_anchor + "from html import escape as html_escape\\nfrom urllib.parse import quote\\n", 1)

          route_anchor = '@app.route("/health")'
          route = r'''def _reply_response(response, status=None):
      if not hasattr(response, "headers"):
          response = Response(response, mimetype="text/html")
      response.headers["Cache-Control"] = "no-store"
      response.headers["Referrer-Policy"] = "no-referrer"
      response.headers["X-Robots-Tag"] = "noindex"
      if status is not None:
          response.status_code = status
      return response


  def _reply_error_response(exc):
      response = jsonify({"error": exc.message})
      response.status_code = exc.status_code
      return _reply_response(response)


  def _render_reply_proposal(proposal, error=None):
      try:
          context = json.loads(proposal.get("source_context") or "{}")
      except (TypeError, ValueError):
          context = {}
      proposal_id = html_escape(str(proposal.get("proposal_id") or ""), quote=True)
      status = html_escape(str(proposal.get("status") or "unknown"), quote=True)
      source_message_id = html_escape(str(proposal.get("source_message_id") or ""), quote=True)
      author_name = html_escape(str(context.get("author_name") or "unknown"))
      username = html_escape(str(context.get("username") or ""))
      author_id = html_escape(str(context.get("author_id") or ""))
      content = html_escape(str(context.get("content") or ""))
      timestamp = html_escape(str(context.get("timestamp") or ""))
      reply = html_escape(str(proposal.get("reply_message") or ""))
      encoded_id = quote(str(proposal.get("proposal_id") or ""), safe="")
      base = request.url_root.rstrip("/")
      approve_url = f"{base}/discord/replies/approve?proposal_id={encoded_id}"
      confirm_url = f"{approve_url}&confirm=1"
      links = ""
      if proposal.get("status") == "pending":
          links = (
              f'<p><a href="{html_escape(approve_url, quote=True)}">Review approval</a> '
              f'or <a href="{html_escape(confirm_url, quote=True)}">Confirm and send</a></p>'
          )
      error_html = f'<p><strong>Error:</strong> {html_escape(str(error))}</p>' if error else ""
      body = f"""<!doctype html>
  <html><head><meta charset="utf-8"><title>Reply proposal</title></head><body>
  <h1>Discord reply proposal</h1>
  <p><strong>Status:</strong> {status}</p>
  <p><strong>Proposal:</strong> {proposal_id}</p>
  <p><strong>Source message:</strong> {source_message_id}</p>
  <p><strong>Author:</strong> {author_name} {username} {author_id}</p>
  <p><strong>Timestamp:</strong> {timestamp}</p>
  <p><strong>Source:</strong></p><pre>{content}</pre>
  <p><strong>Reply:</strong></p><pre>{reply}</pre>
  {links}{error_html}
  </body></html>"""
      return _reply_response(Response(body, mimetype="text/html"))


  def _reply_authenticate_channel(channel_id):
      auth_context = _require_tenant_api_key_context()
      db = get_db()
      if (
          channel_id not in TP_PUBLIC_CHANNEL_IDS
          and not db.is_channel_allowed_for_tenant(auth_context.tenant_id, channel_id)
      ):
          raise ApiError("channel_not_allowed_for_tenant", 403)
      return auth_context


  @app.route("/discord/replies/propose", methods=["GET"])
  def discord_replies_propose():
      try:
          auth_context = _reply_authenticate_channel(
              _validate_channel_id(request.args.get("channel_id"))
          )
          channel_id = _validate_channel_id(request.args.get("channel_id"))
          message_id = _validate_message_id(request.args.get("message_id"))
          reply_message = request.args.get("reply_message", "")
          if not reply_message.strip():
              raise ApiError("missing_reply_message", 400)
          source = _fetch_discord_message_by_id(channel_id, message_id)
          raw_history = _fetch_discord_messages_raw(channel_id, min(100, max(1, MENTION_REPLY_LOOKBACK_LIMIT)))
          raw_source = next((item for item in raw_history if str(item.get("id", "")) == message_id), {})
          raw_author = raw_source.get("author") if isinstance(raw_source.get("author"), dict) else {}
          normalized_author = source.get("author") if isinstance(source.get("author"), dict) else {}
          author = raw_author or normalized_author
          author_id = str(author.get("id") or source.get("author_id") or "").strip()
          username = str(author.get("username") or "").strip()
          author_name = str(
              author.get("global_name") or author.get("display_name") or username
              or source.get("author") or "unknown"
          ).strip()
          bot_user_id = _fetch_discord_bot_user_id()
          if _bot_already_replied_to_message(
              mention_message_id=message_id,
              bot_user_id=bot_user_id,
              channel_history=raw_history,
          ):
              return _reply_response(Response("<p>Already replied to this message.</p>", mimetype="text/html"), 409)
          now = int(time.time())
          db = get_db()
          source_context = json.dumps(
              {
                  "author_name": author_name,
                  "username": username,
                  "author_id": author_id,
                  "content": str(raw_source.get("content") or source.get("content") or "")[:500],
                  "timestamp": str(raw_source.get("timestamp") or source.get("timestamp") or ""),
              },
              separators=(",", ":"),
          )
          proposal = db.create_reply_proposal(
              proposal_id=secrets.token_urlsafe(32),
              tenant_id=auth_context.tenant_id,
              channel_id=channel_id,
              source_message_id=message_id,
              reply_message=reply_message,
              source_context=source_context,
              created_at=now,
              expires_at=now + 3600,
          )
          return _render_reply_proposal(proposal)
      except ApiError as exc:
          return _reply_error_response(exc)


  @app.route("/discord/replies/approve", methods=["GET"])
  def discord_replies_approve():
      proposal_id = request.args.get("proposal_id", "").strip()
      if not proposal_id:
          return _reply_response(Response("<p>Missing proposal_id.</p>", mimetype="text/html"), 400)
      db = get_db()
      proposal = db.get_reply_proposal(proposal_id)
      if not proposal:
          return _reply_response(Response("<p>Reply proposal not found.</p>", mimetype="text/html"), 404)
      now = int(time.time())
      db.expire_reply_proposal_if_needed(proposal_id, now)
      proposal = db.get_reply_proposal(proposal_id)
      confirm = request.args.get("confirm", "").strip().lower() in {"1", "true", "yes", "on"}
      if not confirm or proposal.get("status") != "pending":
          return _render_reply_proposal(proposal)
      if not db.claim_reply_proposal(proposal_id, now):
          return _render_reply_proposal(db.get_reply_proposal(proposal_id))
      proposal = db.get_reply_proposal(proposal_id)
      try:
          channel_id = proposal["channel_id"]
          message_id = proposal["source_message_id"]
          raw_history = _fetch_discord_messages_raw(channel_id, min(100, max(1, MENTION_REPLY_LOOKBACK_LIMIT)))
          bot_user_id = _fetch_discord_bot_user_id()
          if _bot_already_replied_to_message(
              mention_message_id=message_id,
              bot_user_id=bot_user_id,
              channel_history=raw_history,
          ):
              db.mark_reply_proposal_sent(proposal_id, "already_replied")
              return _render_reply_proposal(db.get_reply_proposal(proposal_id))
          try:
              context = json.loads(proposal.get("source_context") or "{}")
          except (TypeError, ValueError):
              context = {}
          user_id = str(context.get("author_id") or "").strip()
          status = _build_user_activity_status(user_id, raw_history) if user_id else {}
          _post_discord_message_reply(
              channel_id,
              message_id,
              user_id,
              status,
              custom_reply_message=proposal["reply_message"],
          )
      except Exception as exc:
          db.restore_reply_proposal(proposal_id, str(exc))
          return _render_reply_proposal(db.get_reply_proposal(proposal_id), error=str(exc))
      db.mark_reply_proposal_sent(proposal_id, "sent")
      return _render_reply_proposal(db.get_reply_proposal(proposal_id))


'''
          if route_anchor not in app:
              raise SystemExit("app route anchor not found")
          app = app.replace(route_anchor, route + route_anchor, 1)
          app_path.write_text(app)
          PY
          python -m py_compile app.py db.py
          git diff --check
          git diff --stat
          rm -f .github/workflows/implement-reply.yml
          git add app.py db.py .github/workflows/implement-reply.yml
          git commit -m 'Add GET-based affirm-unsolicited-reply proposal flow'
          git push origin HEAD:affirm-reply-feature
