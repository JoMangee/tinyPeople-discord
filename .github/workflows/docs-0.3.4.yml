name: docs 0.3.4

on:
  push:
    branches:
      - affirm-reply-feature
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-docs:
    if: github.ref == 'refs/heads/affirm-reply-feature'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout affirm-reply-feature
        uses: actions/checkout@v4
        with:
          ref: affirm-reply-feature
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply requested docs, help, and privacy edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile

          root = Path.cwd()

          def exact(text, old, new, label):
              if new in text:
                  return text
              count = text.count(old)
              if count == 0:
                  raise RuntimeError(f'{label}: old anchor absent and new text absent')
              return text.replace(old, new)

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          old_release = '## 0.3.3 — 2026-07-19\n'
          new_release = ('## 0.3.4 — 2026-09-08\n\n'
                         '### Added\n'
                         '- Human-gated affirm-reply flow: GET /discord/replies/propose creates a pending proposal; GET /discord/replies/approve?proposal_id=ID&confirm=1 sends it once. Nothing auto-posts; proposals expire after one hour.\n'
                         '- db.py: reply_proposals table (status pending/approved/sent/expired/failed), UNIQUE (channel_id, source_message_id), atomic claim helper.\n\n'
                         '### Changed\n'
                         '- BOT_VERSION bumped to 0.3.4\n'
                         '- README and /help updated for the new endpoints\n'
                         '- /privacy updated: pending proposals hold source context and the proposed reply until approved, expired, or deleted.\n\n')
          text = exact(text, old_release, new_release + old_release, 'CHANGELOG 0.3.4 release block')
          changelog.write_text(text, encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = exact(text, '**Version 0.3.3**', '**Version 0.3.4**', 'README version')
          old_endpoints = '- GET /discord/mentions/respond\n'
          new_endpoints = (old_endpoints
                           '- GET /discord/replies/propose\n'
                           '- GET /discord/replies/approve\n')
          text = exact(text, old_endpoints, new_endpoints, 'README affirm-reply endpoints')
          readme.write_text(text, encoding='utf-8')

          version = root / 'VERSION'
          text = version.read_text(encoding='utf-8')
          version.write_text(exact(text, '0.3.2\n', '0.3.4\n', 'VERSION'), encoding='utf-8')

          app = root / 'app.py'
          text = app.read_text(encoding='utf-8')
          text = exact(text, 'BOT_VERSION = "0.3.3"', 'BOT_VERSION = "0.3.4"', 'app BOT_VERSION')

          help_marker = 'Affirm-reply (human-gated; nothing sends until you approve):'
          if help_marker not in text:
              debug_pos = text.find('tp_debug=1')
              health_marker = '"Health endpoint:",' 
              health_pos = text.find(health_marker, debug_pos + 1)
              if debug_pos < 0 or health_pos < 0:
                  raise RuntimeError('app help: contextual tp_debug=1/Health endpoint anchors absent and new text absent')
              line_start = text.rfind('\n', 0, health_pos) + 1
              indent = text[line_start:health_pos]
              block = (
                  f'{indent}"{help_marker}",\n'
                  f'{indent}f"{{base_url}}/discord/replies/propose?channel_id=CHANNEL_ID&message_id=MESSAGE_ID&reply_message=TEXT&tp_key=YOUR_KEY",\n'
                  f'{indent}f"{{base_url}}/discord/replies/approve?proposal_id=PROPOSAL_ID&tp_key=YOUR_KEY",\n'
                  f'{indent}f"{{base_url}}/discord/replies/approve?proposal_id=PROPOSAL_ID&confirm=1&tp_key=YOUR_KEY",\n'
                  f'{indent}"",\n'
              )
              text = text[:health_pos] + block + text[health_pos:]

          privacy_start = text.find('@app.route("/privacy")')
          if privacy_start < 0:
              raise RuntimeError('privacy: route anchor absent and new text absent')
          privacy_end = text.find('\n\n\n# REPLY_PROPOSAL_WORKFLOW_APP_V2', privacy_start)
          if privacy_end < 0:
              privacy_end = len(text)
          privacy = text[privacy_start:privacy_end]
          privacy = exact(privacy,
              '<li>We do not store Discord message content.</li>',
              '<li>We do not store Discord message content, except the source-message context and proposed reply held in a pending affirm-reply proposal until it is approved, expires (1 hour), or is deleted.</li>',
              'privacy content')
          privacy = exact(privacy,
              '<li>We do not store user IDs of people who send messages (only the requesting agent/key).</li>',
              '<li>We do not store user IDs of people who send messages, except the requesting agent/key and, transiently, the source author identifier within a pending reply proposal.</li>',
              'privacy user IDs')
          privacy = exact(privacy,
              '<p>Last updated: April 2026</p>',
              '<p>Last updated: September 2026</p>',
              'privacy date')
          text = text[:privacy_start] + privacy + text[privacy_end:]
          app.write_text(text, encoding='utf-8')

          py_compile.compile(str(root / 'app.py'), doraise=True)
          py_compile.compile(str(root / 'db.py'), doraise=True)
          print('py_compile: app.py db.py OK')
          PY
      - name: Commit and push final changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm --cached --ignore-unmatch .github/workflows/docs-0.3.4.yml >/dev/null 2>&1 || true
          git rm -f --ignore-unmatch .github/workflows/docs-0.3.4.yml >/dev/null 2>&1 || true
          git add -A
          git commit -m 'docs: 0.3.4 changelog readme help privacy updates'
          git push origin HEAD:affirm-reply-feature
