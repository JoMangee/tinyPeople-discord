name: docs 0.3.4

on:
  push:
    branches:
      - affirm-reply-feature
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-docs:
    if: github.ref == 'refs/heads/affirm-reply-feature'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout affirm-reply-feature
        uses: actions/checkout@v4
        with:
          ref: affirm-reply-feature
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply requested docs, help, and privacy edits
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import py_compile

          root = Path.cwd()

          def replace_once(path, old, new, label):
              target = root / path
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(label + ": expected one old anchor, found " + str(count))
              updated = text.replace(old, new)
              target.write_text(updated, encoding="utf-8")
              return updated

          old_release = "## 0.3.3 — 2026-07-19\n"
          new_release = (
              "## 0.3.4 — 2026-09-08\n\n"
              "### Added\n"
              "- Human-gated affirm-reply flow: GET /discord/replies/propose creates a pending proposal; GET /discord/replies/approve?proposal_id=ID&confirm=1 sends it once. Nothing auto-posts; proposals expire after one hour.\n"
              "- db.py: reply_proposals table (status pending/approved/sent/expired/failed), UNIQUE (channel_id, source_message_id), atomic claim helper.\n\n"
              "### Changed\n"
              "- BOT_VERSION bumped to 0.3.4\n"
              "- README and /help updated for the new endpoints\n"
              "- /privacy updated: pending proposals hold source context and the proposed reply until approved, expired, or deleted.\n\n"
          )
          replace_once("CHANGELOG.md", old_release, new_release + old_release, "CHANGELOG 0.3.4 release block")

          replace_once("README.md", "**Version 0.3.3**", "**Version 0.3.4**", "README version")
          old_endpoints = "- GET /discord/mentions/respond\n"
          new_endpoints = (
              old_endpoints
              + "- GET /discord/replies/propose\n"
              + "- GET /discord/replies/approve\n"
          )
          replace_once("README.md", old_endpoints, new_endpoints, "README endpoint list")

          version_file = root / "VERSION"
          version_text = version_file.read_text(encoding="utf-8")
          if "0.3.4\n" not in version_text:
              if version_text.count("0.3.2\n") == 1:
                  version_text = version_text.replace("0.3.2\n", "0.3.4\n")
              elif version_text.count("0.3.3\n") == 1:
                  version_text = version_text.replace("0.3.3\n", "0.3.4\n")
              else:
                  raise RuntimeError("VERSION: no supported old version anchor")
              version_file.write_text(version_text, encoding="utf-8")

          replace_once("app.py", "BOT_VERSION = \"0.3.3\"", "BOT_VERSION = \"0.3.4\"", "app BOT_VERSION")

          app_file = root / "app.py"
          app_text = app_file.read_text(encoding="utf-8")
          help_marker = "Affirm-reply (human-gated; nothing sends until you approve):"
          if help_marker not in app_text:
              debug_pos = app_text.find("tp_debug=1")
              health_pos = app_text.find("\"Health endpoint:\"", debug_pos + 1)
              if debug_pos < 0 or health_pos < 0:
                  raise RuntimeError("app help: required health anchor absent")
              line_start = app_text.rfind("\n", 0, health_pos) + 1
              indent = app_text[line_start:health_pos]
              help_block = (
                  indent + "\"" + help_marker + "\",\n"
                  + indent + "f\"{base_url}/discord/replies/propose?channel_id=CHANNEL_ID&message_id=MESSAGE_ID&reply_message=TEXT&tp_key=YOUR_KEY\",\n"
                  + indent + "f\"{base_url}/discord/replies/approve?proposal_id=PROPOSAL_ID&tp_key=YOUR_KEY\",\n"
                  + indent + "f\"{base_url}/discord/replies/approve?proposal_id=PROPOSAL_ID&confirm=1&tp_key=YOUR_KEY\",\n"
              )
              app_text = app_text[:line_start] + help_block + app_text[line_start:]
              app_file.write_text(app_text, encoding="utf-8")

          app_text = app_file.read_text(encoding="utf-8")
          privacy_start = app_text.find('@app.route("/privacy")')
          if privacy_start < 0:
              raise RuntimeError("privacy: route anchor absent")
          privacy_end = app_text.find("\n\n\n# REPLY_PROPOSAL_WORKFLOW_APP_V2", privacy_start)
          if privacy_end < 0:
              privacy_end = len(app_text)
          privacy = app_text[privacy_start:privacy_end]
          privacy = privacy.replace(
              "<li>We do not store Discord message content.</li>",
              "<li>We do not store Discord message content, except the source-message context and proposed reply held in a pending affirm-reply proposal until it is approved, expires (1 hour), or is deleted.</li>",
          )
          privacy = privacy.replace(
              "<li>We do not store user IDs of people who send messages (only the requesting agent/key).</li>",
              "<li>We do not store user IDs of people who send messages, except the requesting agent/key and, transiently, the source author identifier within a pending reply proposal.</li>",
          )
          privacy = privacy.replace(
              "<p>Last updated: April 2026</p>",
              "<p>Last updated: September 2026</p>",
          )
          app_text = app_text[:privacy_start] + privacy + app_text[privacy_end:]
          app_file.write_text(app_text, encoding="utf-8")

          py_compile.compile(str(root / "app.py"), doraise=True)
          py_compile.compile(str(root / "db.py"), doraise=True)
          print("py_compile: app.py db.py OK")
          PY
          python /tmp/patch.py
          python -m py_compile app.py db.py

      - name: Commit and push final changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f -- .github/workflows/docs-0.3.4.yml
          git add -A
          git commit -m 'docs: 0.3.4 changelog readme help privacy updates'
          git push origin HEAD:affirm-reply-feature
